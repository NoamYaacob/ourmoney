name: CI — Trust Gate

# The real gate on `main`. Runs automatically on every pull request targeting
# `main`, and again on push to `main` for post-merge verification. Before
# this workflow, none of the project's real checks (RLS suite, tsc, eslint,
# jest, Expo export) ran on any PR or push to `main` — every prior workflow
# in this directory triggered only on `workflow_dispatch` or a push to a
# specific, disposable per-milestone branch. This consolidates that
# generalized pattern (proven first in migration-007-db-validation.yml) into
# one workflow that actually targets the branch it's meant to protect,
# instead of adding a sixth milestone-specific file.
#
# Independent jobs keep unrelated validation results visible and prevent a
# slow job from masking an already-decided result in another layer.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  db-validation:
    name: Real database / RLS gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase in GitHub runner
        run: supabase start

      - name: Reset database and apply all migrations from scratch
        run: supabase db reset

      - name: Assert no remote Supabase configuration is present
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -n "$SUPABASE_ACCESS_TOKEN" ] || [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "A remote/production-shaped Supabase env var is set in this job — refusing to continue." >&2
            exit 1
          fi
          echo "Confirmed: no remote Supabase URL, access token, or DB password is set. Local stack only."

      - name: Run full RLS/database test suite
        shell: bash
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/rls_tests.sql 2>&1 | tee rls-test-output.txt
          grep -F "=== ALL RLS TESTS PASSED" rls-test-output.txt
          grep -F "PASS RECURRING.CONCURRENT" rls-test-output.txt
          grep -F "PASS DELETE_ACCOUNT.CONCURRENT" rls-test-output.txt
          grep -F "PASS LEAVE.CONCURRENT" rls-test-output.txt

      - name: Generate database types
        run: supabase gen types typescript --local > /tmp/database.generated.ts

      - name: Verify core RPCs are present in generated types (regression)
        shell: bash
        run: |
          grep -F "create_household" /tmp/database.generated.ts
          grep -F "accept_invitation" /tmp/database.generated.ts
          grep -F "generate_recurring_transactions" /tmp/database.generated.ts
          grep -F "skip_recurring_occurrence" /tmp/database.generated.ts
          grep -F "delete_own_account" /tmp/database.generated.ts
          grep -F "leave_household" /tmp/database.generated.ts
          grep -F "save_budget_allocations" /tmp/database.generated.ts

      - name: Diff generated types against the hand-authored types/database.ts
        shell: bash
        run: |
          set +e
          diff -u types/database.ts /tmp/database.generated.ts > /tmp/types.diff
          echo "diff exit code: $?"
          set -e
          wc -l /tmp/types.diff
          cat /tmp/types.diff

      - name: Upload RLS output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rls-output
          path: rls-test-output.txt
          if-no-files-found: ignore

      - name: Upload generated types and diff (always, for reconciliation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-generated-types
          path: |
            /tmp/database.generated.ts
            /tmp/types.diff
          if-no-files-found: ignore

  app-checks:
    name: App-layer checks (tests / typecheck / lint / diff)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch main for whitespace diff check
        run: git fetch origin main

      - name: Check for whitespace errors relative to main
        run: git diff --check origin/main...HEAD

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 90 npm test -- --runInBand 2>&1 | tee jest-output.txt || true
          grep -qE "^Test Suites: [0-9]+ passed, [0-9]+ total$" jest-output.txt
          grep -qE "^Tests:       [0-9]+ passed, [0-9]+ total$" jest-output.txt

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Upload Jest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-jest-output
          path: jest-output.txt
          if-no-files-found: ignore

  expo-export:
    name: Expo health + export (web + iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Expo export — web
        run: npx expo export --platform web

      - name: Expo export — iOS
        run: npx expo export --platform ios

      - name: Expo export — Android
        run: npx expo export --platform android

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit triage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full audit report (informational during triage)
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-full.json
          STATUS=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('npm-audit-full.json', 'utf8'));
          console.log('FULL_AUDIT_METADATA=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
            console.log(`AUDIT ${name}: severity=${v.severity}; direct=${v.isDirect}; range=${v.range}; fix=${JSON.stringify(v.fixAvailable)}`);
            for (const via of v.via ?? []) {
              if (typeof via === 'object') console.log(`  VIA ${via.name}: ${via.severity} ${via.title} range=${via.range}`);
            }
          }
          NODE
          echo "Full npm audit exit code: $STATUS (informational in this triage PR)"

      - name: Production-only audit report
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-prod.json
          STATUS=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('npm-audit-prod.json', 'utf8'));
          console.log('PROD_AUDIT_METADATA=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
            console.log(`PROD_AUDIT ${name}: severity=${v.severity}; direct=${v.isDirect}; range=${v.range}; fix=${JSON.stringify(v.fixAvailable)}`);
          }
          NODE
          echo "Production-only npm audit exit code: $STATUS (informational until triage is complete)"

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-triage
          path: |
            npm-audit-full.json
            npm-audit-prod.json
          if-no-files-found: error
