name: Migration 007 DB Validation

# Real Supabase database/RLS gate for the Annual Expenses / Planned
# Obligations milestone (supabase/migrations/007_planned_obligations.sql).
# Mirrors milestone-9-db-validation.yml's proven pattern exactly: a
# disposable local Supabase stack started BY THIS RUNNER via `supabase
# start` (real Postgres + Auth in Docker containers that exist only for the
# lifetime of this job) — no SUPABASE_ACCESS_TOKEN, no SUPABASE_DB_PASSWORD,
# no SUPABASE_PROJECT_REF, no `supabase link`, no hosted project touched.
# The local stack's Postgres password is Supabase CLI's own well-known local
# default ('postgres', bound to 127.0.0.1 only, torn down with the runner),
# not a secret.
#
# Two independent jobs, same reasoning as milestone-9-db-validation.yml: the
# real-Postgres/RLS gate must produce a clean, trustworthy pass/fail signal
# on its own, independent of unrelated app-layer (test/typecheck/lint) job
# timing.

on:
  workflow_dispatch:
  push:
    branches:
      - preview/iphone-local
    paths:
      - 'supabase/**'
      - '.github/workflows/migration-007-db-validation.yml'

permissions:
  contents: read

jobs:
  db-validation:
    name: Real database / RLS gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase in GitHub runner
        run: supabase start

      - name: Reset database and apply all migrations (001 -> 007) from scratch
        run: supabase db reset

      # Structural proof this run never touched anything remote: local-only
      # ports/host, and the remote-shaped env vars this app's client code
      # needs are deliberately left unset here — nothing in this job can
      # accidentally point the app at a real project.
      - name: Assert no remote Supabase configuration is present
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -n "$SUPABASE_ACCESS_TOKEN" ] || [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "A remote/production-shaped Supabase env var is set in this job — refusing to continue." >&2
            exit 1
          fi
          echo "Confirmed: no remote Supabase URL, access token, or DB password is set. Local stack only."

      - name: Run full RLS/database test suite (incl. OBLIGATIONS.* group)
        shell: bash
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/rls_tests.sql 2>&1 | tee rls-test-output.txt
          grep -F "=== ALL RLS TESTS PASSED" rls-test-output.txt
          grep -F "PASS RECURRING.CONCURRENT" rls-test-output.txt
          grep -F "PASS DELETE_ACCOUNT.CONCURRENT" rls-test-output.txt
          grep -F "PASS LEAVE.CONCURRENT" rls-test-output.txt

      - name: Verify no OBLIGATIONS.* test was silently skipped
        shell: bash
        run: |
          # A test that errored would already have aborted the script above
          # (-v ON_ERROR_STOP=1); this additionally catches a test that was
          # accidentally commented out or never reached.
          for t in \
            OBLIGATIONS.ISOLATION.1 OBLIGATIONS.ISOLATION.2 \
            OBLIGATIONS.INSERT.1 OBLIGATIONS.INSERT.2 \
            OBLIGATIONS.D2.1 OBLIGATIONS.D2.2 OBLIGATIONS.D2.3 OBLIGATIONS.D2.4 \
            OBLIGATIONS.UPDATE.1 OBLIGATIONS.DELETE.1 \
            OBLIGATIONS.CHECK.1 OBLIGATIONS.CHECK.2 OBLIGATIONS.CHECK.3 \
            OBLIGATIONS.LEAVE.1; do
            grep -F "PASS $t:" rls-test-output.txt || { echo "Missing PASS for test $t" >&2; exit 1; }
          done
          echo "All 14 OBLIGATIONS.* tests confirmed present in the output."

      - name: Inspect planned_obligations table + RLS structurally against the real local database
        shell: bash
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          -- RLS enabled (structural, matches rls_tests.sql 6.3)
          SELECT tablename, rowsecurity FROM pg_tables WHERE schemaname = 'public' AND tablename = 'planned_obligations';

          -- Exactly the four expected policies exist (matches 6.4)
          SELECT policyname, cmd FROM pg_policies WHERE schemaname = 'public' AND tablename = 'planned_obligations' ORDER BY policyname;

          -- Grants: authenticated has SELECT/INSERT/UPDATE/DELETE, anon has none,
          -- authenticated has no TRUNCATE/REFERENCES/TRIGGER (matches
          -- rls_tests.sql's generic grants-parity check).
          SELECT grantee, privilege_type FROM information_schema.role_table_grants
          WHERE table_schema = 'public' AND table_name = 'planned_obligations' ORDER BY grantee, privilege_type;

          -- leave_household()/delete_own_account() are still SECURITY DEFINER
          -- with a fixed search_path after migration 007's CREATE OR REPLACE
          -- (matches rls_tests.sql 6.5, structurally re-verified here since
          -- this migration re-declares both function bodies).
          SELECT proname, prosecdef, proconfig FROM pg_proc
          WHERE proname IN ('leave_household', 'delete_own_account') AND pronamespace = 'public'::regnamespace
          ORDER BY proname;
          SQL

      - name: Generate database types
        run: supabase gen types typescript --local > /tmp/database.generated.ts

      - name: Verify planned_obligations is in generated types
        shell: bash
        run: |
          grep -F "planned_obligations" /tmp/database.generated.ts

      - name: Verify prior migrations' tables/RPCs are still in generated types (regression)
        shell: bash
        run: |
          grep -F "savings_goals" /tmp/database.generated.ts
          grep -F "recurring_transactions" /tmp/database.generated.ts
          grep -F "delete_own_account" /tmp/database.generated.ts
          grep -F "leave_household" /tmp/database.generated.ts
          grep -F "save_budget_allocations" /tmp/database.generated.ts

      - name: Diff generated types against the hand-authored types/database.ts
        shell: bash
        run: |
          set +e
          diff -u types/database.ts /tmp/database.generated.ts > /tmp/types.diff
          echo "diff exit code: $?"
          set -e
          wc -l /tmp/types.diff
          cat /tmp/types.diff

      - name: Upload RLS output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-007-rls-output
          path: rls-test-output.txt
          if-no-files-found: ignore

      - name: Upload generated types and diff (always, for local reconciliation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-007-generated-types
          path: |
            /tmp/database.generated.ts
            /tmp/types.diff
          if-no-files-found: ignore

  app-checks:
    name: App-layer checks (tests / typecheck / lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          # Full history, not just the pushed commit: needed so
          # `git diff --check origin/main...HEAD` below can find a real
          # merge base instead of diffing against nothing.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch main for whitespace diff check
        run: git fetch origin main

      - name: Check for whitespace errors relative to main
        run: git diff --check origin/main...HEAD

      # See milestone-9-db-validation.yml's identical step for why `timeout`
      # bounds the whole process tree externally and pass/fail is judged
      # from Jest's own printed summary line, not the wrapped process's exit
      # code — this runner's npm/sh/node process tree does not reliably
      # exit on its own after Jest itself finishes.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 90 npm test -- --runInBand 2>&1 | tee jest-output.txt || true
          grep -qE "^Test Suites: [0-9]+ passed, [0-9]+ total$" jest-output.txt
          grep -qE "^Tests:       [0-9]+ passed, [0-9]+ total$" jest-output.txt

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint
