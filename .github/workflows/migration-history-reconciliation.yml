name: Migration History Alignment Check

# The OurMoney Preview migration history was reconciled on 2026-08-18 so the
# hosted project now records the same numeric versions as this branch:
# 001..009. This workflow is intentionally READ-ONLY. It must never repair,
# insert, update, delete, or otherwise mutate migration history.

on:
  workflow_dispatch:
  push:
    branches:
      - preview/iphone-local
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-history-reconciliation.yml'

permissions:
  contents: read

jobs:
  verify-migration-history:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: safxtriacputgmpsdgkm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview/iphone-local

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link exact Preview project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify local and remote migration versions are exactly aligned
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee /tmp/migration-list.txt

          for v in 001 002 003 004 005 006 007 008 009; do
            # Supabase CLI formatting varies slightly across releases, so
            # require the version to appear twice on one row: local + remote.
            awk -v v="$v" '$0 ~ v { n=gsub(v,v); if (n >= 2) ok=1 } END { exit(ok ? 0 : 1) }' /tmp/migration-list.txt \
              || { echo "ABORT: migration $v is not aligned local/remote"; exit 1; }
          done

          # No old timestamp-only migration history should remain.
          if grep -Eq '20260818183746|20260818183853|20260818184029|20260818184149' /tmp/migration-list.txt; then
            echo 'ABORT: obsolete timestamp migration versions are still present.'
            exit 1
          fi

          echo 'OK: OurMoney Preview migration history is aligned at 001-009.'

      - name: Prove db push proposes no migration
        run: |
          set -euo pipefail
          if supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" > /tmp/db-push-dry-run.txt 2>&1; then
            cat /tmp/db-push-dry-run.txt
          else
            cat /tmp/db-push-dry-run.txt
            echo 'ABORT: dry-run failed; do not perform a real push.'
            exit 1
          fi

          if grep -qiE '\b(CREATE|ALTER|DROP|GRANT|REVOKE|INSERT|UPDATE|DELETE)\b' /tmp/db-push-dry-run.txt; then
            echo 'ABORT: dry-run appears to propose a database-changing statement.'
            exit 1
          fi

          echo 'OK: db push dry-run is a no-op.'
