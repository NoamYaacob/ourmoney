name: Migration History Alignment Check

# OurMoney Preview's migration history was reconciled on 2026-08-18. This
# workflow is intentionally READ-ONLY: the reconciled baseline must match the
# hosted Preview project and db push is shown only as a dry run.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-history-reconciliation.yml'

permissions:
  contents: read

jobs:
  verify-migration-history:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: safxtriacputgmpsdgkm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link exact Preview project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify reconciled baseline is aligned
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee /tmp/migration-list.txt

          if grep -Eq '20260818183746|20260818183853|20260818184029|20260818184149|20260818185401|20260818191334' /tmp/migration-list.txt; then
            echo 'ABORT: obsolete timestamp migration versions are still present.'
            exit 1
          fi

          for v in 001 002 003 004 005 006 007 008 009 010 011; do
            awk -v v="$v" '$0 ~ v { n=gsub(v,v); if (n >= 2) ok=1 } END { exit(ok ? 0 : 1) }' /tmp/migration-list.txt \
              || { echo "ABORT: baseline migration $v is not aligned local/remote"; exit 1; }
          done

          echo 'OK: OurMoney Preview migration baseline 001-011 is aligned.'

      - name: Show db push dry-run only
        run: |
          set -euo pipefail
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee /tmp/db-push-dry-run.txt
          echo 'Dry-run only; this workflow never performs a real database push.'
