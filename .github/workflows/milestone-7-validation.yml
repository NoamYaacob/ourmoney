name: Milestone 7 Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase in GitHub runner
        run: supabase start

      - name: Reset database and apply all migrations
        run: supabase db reset

      - name: Run full RLS test suite
        shell: bash
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/rls_tests.sql 2>&1 | tee rls-test-output.txt
          grep -F "=== ALL RLS TESTS PASSED" rls-test-output.txt
          grep -F "PASS RECURRING.CONCURRENT" rls-test-output.txt

      - name: Generate database types
        run: supabase gen types typescript --local > /tmp/database.generated.ts

      - name: Verify Milestone 7 RPCs are in generated types
        shell: bash
        run: |
          grep -F "generate_recurring_transactions" /tmp/database.generated.ts
          grep -F "skip_recurring_occurrence" /tmp/database.generated.ts
          grep -F "advance_recurring_due_date" /tmp/database.generated.ts

      - name: Unit tests
        run: npm test -- --runInBand

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Upload RLS output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-7-rls-output
          path: rls-test-output.txt
          if-no-files-found: ignore
