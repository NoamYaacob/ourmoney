name: One-shot RTL cleanup bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-preview-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/responsive-qa-polish
          fetch-depth: 0
      - name: Remove legacy web RTL compensation classes
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*.tsx'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              s=p.read_text()
              n=s.replace('web:flex-row-reverse', 'web:flex-row')
              if n != s:
                  p.write_text(n)
                  changed.append(str(p))
          print('\n'.join(changed))
          PY
          git diff --check
      - name: Commit cleanup to preview branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ourmoney-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m 'fix: remove legacy web RTL compensations'
          git push origin HEAD:agent/responsive-qa-polish
