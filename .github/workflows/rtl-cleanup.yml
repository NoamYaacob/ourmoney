name: One-shot RTL compensation cleanup

on:
  push:
    branches: [agent/responsive-qa-polish]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message != 'fix: remove legacy web RTL compensations' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/responsive-qa-polish
          fetch-depth: 0
      - name: Remove legacy web row reversal compensation
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*.tsx'):
              if 'node_modules' in p.parts:
                  continue
              s=p.read_text()
              n=s.replace('web:flex-row-reverse', 'web:flex-row')
              if n != s:
                  p.write_text(n)
                  changed.append(str(p))
          print('changed:', *changed, sep='\n- ')
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ourmoney-ci"
          git config user.email "actions@users.noreply.github.com"
          git add '*.tsx' 'app/**/*.tsx' 'components/**/*.tsx' 'features/**/*.tsx' || true
          git commit -am 'fix: remove legacy web RTL compensations'
          git push origin HEAD:agent/responsive-qa-polish
