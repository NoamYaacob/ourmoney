name: One-shot RTL shell patch

on:
  push:
    branches: [agent/responsive-qa-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: align desktop shell with native web RTL' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/responsive-qa-polish
          fetch-depth: 0
      - name: Patch desktop shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(app)/_layout.tsx')
          s = p.read_text()
          s = s.replace('web:flex-row-reverse', 'web:flex-row')
          s = s.replace('w-[220px] shrink-0 border-s border-border-light bg-surface-light px-3 pt-8', 'sticky top-0 h-screen w-[252px] shrink-0 border-s border-border-light bg-surfaceMuted-light/70 px-4 py-6')
          s = s.replace("className={`mb-1 flex-row items-center gap-3 rounded-control px-3 py-2.5 ${focused ? 'bg-surfaceMuted-light dark:bg-surfaceMuted-dark' : ''}`}", "className={`mb-1 flex-row items-center gap-3 rounded-control px-3 py-3 transition-colors ${focused ? 'bg-accent-light/10 dark:bg-accent-dark/10' : 'web:hover:bg-surfaceMuted-light dark:web:hover:bg-surfaceMuted-dark'}`}")
          p.write_text(s)
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "ourmoney-ci"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(app)/_layout.tsx'
          git commit -m 'fix: align desktop shell with native web RTL'
          git push origin HEAD:agent/responsive-qa-polish
